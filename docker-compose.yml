# =============================================================================
# Headroom — full "memory stack" compose
# =============================================================================
# Brings up the Headroom proxy together with the two datastores it needs for
# semantic memory: Qdrant (vector search) and Neo4j (relationship graph).
#
# Quick start:
#   1. cp .env.example .env   # then set a real NEO4J_AUTH before any non-local use
#   2. docker compose up -d
#   3. point your LLM client at http://localhost:8787  (proxy)
#
# Just want the proxy without the memory features? You can run the proxy image
# on its own (`docker run -p 8787:8787 ghcr.io/chopratejas/headroom`); the two
# database services below are only required for the memory/relevance features.
#
# Ports exposed on the host (proxy published to loopback only, see below):
#   8787  proxy (OpenAI-compatible endpoint), bound to 127.0.0.1
#   6333  Qdrant REST   6334  Qdrant gRPC
#   7474  Neo4j Browser 7687  Neo4j Bolt
#
# SECURITY: the proxy's /v1/* data plane has no inbound auth unless
# HEADROOM_PROXY_TOKEN is set (see .env.example). Publishing 8787 on all
# interfaces with no token makes those routes reachable by anyone who can
# reach the host. The port below is published on 127.0.0.1 only so the
# quick-start stays usable with zero token setup; if you need the proxy
# reachable from another machine, set HEADROOM_PROXY_TOKEN in .env AND widen
# the publish address (e.g. "8787:8787").
# =============================================================================

services:
  # Headroom proxy — the OpenAI-compatible endpoint your client talks to.
  # Built from the repo Dockerfile so it tracks your local checkout.
  headroom-proxy:
    build:
      context: .
      args:
        HEADROOM_BUILD_VERSION: ${HEADROOM_BUILD_VERSION:-source-build}
    # Bind to all interfaces inside the container so the published port is reachable.
    command: ["--host", "0.0.0.0"]
    environment:
      - HEADROOM_HOST=0.0.0.0
      - HOME=/home/nonroot
      # Keep all Headroom read/write state on the named volume below.
      - HEADROOM_WORKSPACE_DIR=/home/nonroot/.headroom
      - HEADROOM_CONFIG_DIR=/home/nonroot/.headroom/config
      # Inbound auth for the /v1/* data plane. Empty by default, which is
      # fine as long as the port below stays published on 127.0.0.1 only
      # (loopback callers are exempt). Required if you widen the publish
      # address. See .env.example.
      - HEADROOM_PROXY_TOKEN=${HEADROOM_PROXY_TOKEN:-}
      # if you want to use a custom OpenAI-compatible API endpoint,
      # uncomment and set the following line with the desired URL
      # - OPENAI_TARGET_API_URL=https://api.x.ai
      # CLI-filtering dashboard figures require the `rtk` binary inside this
      # container; it is not installed by this image. See docs/content/docs/docker-install.mdx.
    ports:
      # Loopback-only by default; see the SECURITY note above.
      - "127.0.0.1:8787:8787"
    volumes:
      - headroom_workspace:/home/nonroot/.headroom
    # Readiness probe: the orchestrator polls /readyz so dependents and
    # `docker compose up --wait` only see the proxy as healthy once it's serving.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Start the datastores first. Note: this waits for the containers to start,
    # not for them to be fully ready — the proxy retries its connections, so a
    # brief "database not ready yet" window on first boot is expected.
    depends_on:
      - qdrant
      - neo4j

  # Vector database for semantic search.
  # Stores embeddings so the proxy can retrieve semantically similar context.
  qdrant:
    image: qdrant/qdrant:v1.17.1
    # Loopback only. Qdrant ships with NO authentication by default, and this
    # instance holds the embeddings of whatever conversation content the memory
    # subsystem stored. A bare "6333:6333" publishes that on every interface the
    # host has, unauthenticated, to anyone on the same network. Only the
    # headroom-proxy service needs to reach it, and that happens over the
    # compose network, not through a published host port.
    ports:
      - "127.0.0.1:6333:6333"  # REST API
      - "127.0.0.1:6334:6334"  # gRPC
    # Named volume keeps the vector index across container restarts/recreates.
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # Graph database for relationships and multi-hop reasoning.
  # Backs the memory features that traverse links between stored items.
  neo4j:
    image: neo4j:5.26
    # Loopback only, same reasoning as qdrant: this holds the graph half of the
    # same memory data, and only headroom-proxy needs to reach it.
    ports:
      - "127.0.0.1:7474:7474"  # HTTP (Browser)
      - "127.0.0.1:7687:7687"  # Bolt
    # Named volume persists the graph data across container restarts/recreates.
    volumes:
      - neo4j_data:/data
    environment:
      # Credentials come from .env (NEO4J_AUTH=user/password). There is
      # deliberately NO default: a well-known fallback password is only ever one
      # forgotten override away from being the real one, and "override it before
      # exposing this" is advice that gets read after the exposure, not before.
      # Compose fails fast with a clear message when NEO4J_AUTH is unset.
      - NEO4J_AUTH=${NEO4J_AUTH:?set NEO4J_AUTH=user/password in .env before starting neo4j}
      # APOC: Neo4j's standard procedure library, needed by Headroom's queries.
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true

# Named volumes — managed by Docker, survive `docker compose down` (use
# `docker compose down -v` to delete the stored data as well).
volumes:
  headroom_workspace:    # persists dashboard savings/history, logs, config, memory state, session stats, and TOIN
  qdrant_data:
  neo4j_data:
