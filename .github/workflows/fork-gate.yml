name: Fork Gate

# This fork's correctness gate, and the only workflow that gates merges to main.
#
# It is deliberately NOT the inherited ci.yml. That workflow is 18 jobs across
# three operating systems, wants HF_TOKEN and CODECOV_TOKEN (neither of which
# exists here), and uploads coverage to Codecov — a third-party US host that
# would receive this repository's source under a data-sovereignty SOP that says
# it should not. This runs the four commands in scripts/fork/run-gate.sh, which
# is the same script .claude/pre-push-gate.sh runs locally. One definition, so a
# green local run predicts a green CI run.
#
# Every `uses:` is pinned to a full commit SHA. That is not ceremony: the repo
# sets `sha_pinning_required: true`, which is what stops an unpinned workflow
# arriving on a fork sync from ever executing here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PY_VERSION: "3.12"
  # Nothing about this repository's contents leaves the runner. The model fetch
  # below is an unauthenticated read of a public, pinned repo id; telemetry off.
  HF_HUB_DISABLE_TELEMETRY: "1"
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  static:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PY_VERSION }}
          enable-cache: true

      - name: ruff check
        run: scripts/fork/run-gate.sh lint

      - name: ruff format --check
        run: scripts/fork/run-gate.sh format

      - name: mypy
        run: scripts/fork/run-gate.sh types

  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PY_VERSION }}
          enable-cache: true

      # `uv run` builds headroom._core through maturin, which shells out to
      # cargo. ubuntu-latest ships a toolchain, but a cold target/ directory is
      # several minutes of compile on every run.
      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The compression tests need all-MiniLM-L6-v2. Without it they skip, and a
      # green run that quietly skipped the tests covering this fork's own patches
      # is a proxy signal, not verification.
      - name: Cache HuggingFace model
        id: hfcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-models-allMiniLM-v2

      - name: Fetch all-MiniLM-L6-v2 (public model, no token)
        if: steps.hfcache.outputs.cache-hit != 'true'
        run: |
          uvx --with huggingface_hub python -c \
            "from huggingface_hub import snapshot_download; snapshot_download('sentence-transformers/all-MiniLM-L6-v2')"

      - name: pytest
        run: scripts/fork/run-gate.sh test

  quarantine:
    name: Quarantined tests (reporting only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never blocks. Its job is to keep ci/quarantine.txt honest: the tests the
    # gate skips still run and their output is visible, so an entry that starts
    # passing can be noticed and removed rather than living there forever.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PY_VERSION }}
          enable-cache: true

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run the quarantined tests
        run: scripts/fork/run-gate.sh quarantine

  quarantine-guard:
    name: Quarantine may not grow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce the recorded ceiling
        run: python3 scripts/fork/check_quarantine.py
