name: Fork Security

# The security gamut for this fork: secrets, dependencies, code, and the
# workflows themselves.
#
# It is derived from the inherited security.yml, which is a good workflow — it
# already checksum-verifies the gitleaks tarball, which was an open finding
# (#7). Three things are different here:
#
#   1. Every `uses:` is SHA-pinned. The inherited file is not, and under this
#      repo's `sha_pinning_required: true` it could not run at all.
#   2. pip-audit runs as `uvx pip-audit`, not through pypa/gh-action-pip-audit.
#      One less third-party action inside a job that reads the dependency graph.
#   3. zizmor is added. Nothing in the inherited set statically analyses the
#      workflows, which is the surface this whole exercise is about.
#   4. osv-scanner is added, and it is the job that covers the most ground.
#   5. CodeQL is gone and OpenGrep stands in its place. See the note above the
#      source-sast job for what that does and does not reproduce.
#   6. cargo-audit is added. Nothing inherited or fork-owned looked at the Rust
#      dependency tree for yanked crates.
#
# Kept from the original, deliberately: the `--extra all` export excludes the
# `benchmark` extra, whose lm-eval chain carries unpatchable upstream High CVEs
# that are never installed in production, so the audit fails only on findings
# somebody can act on.
#
# Why both pip-audit and osv-scanner. pip-audit answers "is the thing we ship
# to production clean", over one export of 620 packages. It reported zero while
# GitHub held 22 open Dependabot alerts, and both were right: all 22 sat outside
# that export, in opt-in extras or in npm lockfiles. osv-scanner answers the
# wider question, over all six lockfiles (1839 packages) and every ecosystem in
# the tree, cargo included, which Dependabot here does not scan at all. Keeping
# the narrow blocking check and the wide baselined one is the point: production
# stays at zero-tolerance, everything else stays visible.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC. Catches CVEs disclosed since the last commit, which is
    # the only way a repository with no traffic still learns it is vulnerable.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          # Distinct cache key per job. Jobs sharing a key race to reserve it and
          # the losers annotate the run with "Unable to reserve cache with key",
          # a warning that passes the build and still shows up in the panel.
          cache-suffix: security-pip-audit

      - name: Export the production dependency set from uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes \
            --extra all --format requirements-txt > requirements-prod.txt
          echo "auditing $(wc -l < requirements-prod.txt) production dependencies"

      - name: pip-audit
        run: uvx pip-audit==2.10.1 --strict --requirement requirements-prod.txt

  lockfile-audit:
    name: Lockfile audit (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The binary rather than google/osv-scanner-action, which is not on this
      # repo's third-party allowlist. Verified against the release's published
      # SHA256SUMS before it is made executable, same shape as gitleaks below.
      - name: Install osv-scanner
        run: |
          set -euo pipefail
          version=2.4.0
          asset="osv-scanner_linux_amd64"
          base="https://github.com/google/osv-scanner/releases/download/v${version}"

          curl -sSfL "${base}/${asset}" -o /tmp/osv-scanner
          curl -sSfL "${base}/osv-scanner_SHA256SUMS" -o /tmp/osv-sums.txt

          expected="$(grep " ${asset}\$" /tmp/osv-sums.txt | awk '{print $1}')"
          if [ -z "$expected" ]; then
            echo "::error::no checksum entry for ${asset}" >&2
            exit 1
          fi
          echo "${expected}  /tmp/osv-scanner" | sha256sum -c -

          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --version

      # Every lockfile the repository ships, named explicitly. A bare directory
      # scan would silently start or stop covering a file as the tree moves;
      # check_workflow_allowlist.py exists for the same reason. Note cargo:
      # Dependabot on this repo watches npm and pip only, so Cargo.lock had no
      # coverage anywhere until this job.
      - name: Scan every lockfile
        run: |
          set -euo pipefail
          args=()
          for f in uv.lock Cargo.lock docs/package-lock.json \
                   plugins/openclaw/package-lock.json \
                   plugins/opencode/package-lock.json \
                   sdk/typescript/package-lock.json; do
            test -f "$f" || { echo "::error::expected lockfile $f is missing" >&2; exit 1; }
            args+=(--lockfile "$f")
          done
          # Exit 1 just means "found something". The baseline decides whether
          # that is a failure, so the scanner's own status is not the gate.
          /tmp/osv-scanner scan source "${args[@]}" --format json > /tmp/osv.json || true
          test -s /tmp/osv.json

      - name: Compare against ci/vuln-baseline.txt
        run: python3 scripts/fork/check_osv.py /tmp/osv.json

  # Replaces CodeQL, which was removed on 2026-07-29 when this repository became
  # private: code scanning needs GitHub Advanced Security, which a private repo
  # on the free plan does not have, so the job would have failed on every run
  # and the SARIF upload would have been rejected. CodeQL's findings are kept in
  # ci/codeql-snapshot/ (50 open alerts, 27 high, 23 medium) and this job was
  # measured against them rather than against nothing. It reproduces the classes
  # that mattered, and finds three CodeQL missed:
  #
  #   28x logger-credential-disclosure  vs  5x py/clear-text-logging
  #   13x md5/sha1                      vs  1x py/weak-sensitive-data-hashing
  #    3x regex_dos                     vs  4x js/polynomial-redos
  #    2x insecure-file-permissions,  1x path-traversal,  1x cleartext-transport
  #
  # It does not reproduce everything. CodeQL's 16x incomplete-url-substring and
  # 19x stack-trace-exposure land in the non-blocking security/audit tier here.
  #
  # OpenGrep, not Semgrep, because Semgrep relicensed its rules: semgrep-rules
  # is now under the proprietary "Semgrep Rules License v1.0", while
  # opengrep-rules is the pre-relicense fork and stays LGPL-2.1 plus the Commons
  # Clause. The Commons Clause forbids selling a service whose value derives
  # from the rules; scanning our own private repos is not that. OpenGrep also
  # has no telemetry at all (there is no --metrics flag to turn off), which the
  # egress rule in AGENTS.md wants and Semgrep would have needed handling for.
  source-sast:
    name: Source SAST (OpenGrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # OpenGrep publishes sigstore .cert/.sig pairs and no SHA256SUMS file, so
      # this cannot follow the gitleaks and osv-scanner pattern of fetching the
      # release's own checksum list. The digest is pinned here in the repository
      # instead, which is the stronger form: a checksum file fetched from the
      # release it describes is only as trustworthy as that release, whereas
      # changing this line is a reviewable diff.
      - name: Install opengrep
        env:
          OPENGREP_VERSION: "1.26.0"
          OPENGREP_SHA256: "40c21299eeddabf743b856daa843d24f9d4a027130671cd45b3b21776fd9ab26"
        run: |
          set -euo pipefail
          url="https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86"
          curl -sSfL "$url" -o /tmp/opengrep
          echo "${OPENGREP_SHA256}  /tmp/opengrep" | sha256sum -c -
          chmod +x /tmp/opengrep
          /tmp/opengrep --version

      # Pinned to a commit, not a tag or a branch. The repository is archived
      # (last commit 2025-01-26), so the pin is stable by circumstance as well
      # as by intent, and a git SHA needs no separate checksum: it *is* the
      # content hash. Archived also means these rules do not learn about new
      # classes on their own, which is a real limitation and the reason this
      # SHA should be revisited rather than left to rot.
      - name: Fetch opengrep-rules at a pinned commit
        env:
          RULES_SHA: "f1d2b562b414783763fd02a6ed2736eaed622efa"
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/opengrep/opengrep-rules.git /tmp/rules
          git -C /tmp/rules checkout --quiet "$RULES_SHA"
          test "$(git -C /tmp/rules rev-parse HEAD)" = "$RULES_SHA"
          echo "python rules:     $(find /tmp/rules/python -name '*.yaml' | wc -l)"
          echo "javascript rules: $(find /tmp/rules/javascript -name '*.yaml' | wc -l)"
          echo "typescript rules: $(find /tmp/rules/typescript -name '*.yaml' | wc -l)"

      # The whole rule set runs and check_opengrep.py sorts the output into
      # tiers by each rule's own metadata. Filtering by passing only the
      # security/ directories would be faster and wrong: it would silently drop
      # rules whose authors classified them as security without filing them
      # there, and it would lose the audit tier the summary reports.
      - name: Scan
        run: |
          set -euo pipefail
          /tmp/opengrep scan \
            --config /tmp/rules/python \
            --config /tmp/rules/javascript \
            --config /tmp/rules/typescript \
            --no-git-ignore --json --quiet \
            --exclude=node_modules --exclude=target --exclude=dist \
            headroom/ sdk/ plugins/ > /tmp/opengrep.json
          test -s /tmp/opengrep.json

      - name: Compare against ci/sast-baseline.txt
        run: python3 scripts/fork/check_opengrep.py /tmp/opengrep.json

  # Cargo advisories. This overlaps the osv-scanner job above, which already
  # reads Cargo.lock against the same RustSec data, and that overlap is
  # deliberate rather than overlooked: `cargo audit` additionally fails on
  # *yanked* crates, which OSV does not model at all, and it is the tool the
  # RustSec advisories are actually written for. If this job is ever cut, note
  # that yanked-crate detection goes with it and osv-scanner does not cover it.
  rust-advisories:
    name: Cargo advisories (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustsec/rustsec publishes no prebuilt binaries, and rustsec/audit-check
      # is a third-party action this repo does not allow, so cargo-audit is
      # compiled and then cached on its version. --locked builds it from its own
      # committed lockfile, so this step does not resolve fresh dependencies of
      # a security tool on every run.
      - name: Cache cargo-audit
        id: audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2

      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit --version 0.22.2

      # Reads Cargo.lock only; it never builds this workspace. --deny yanked is
      # the reason this job exists next to osv-scanner.
      #
      # The ignore list is READ FROM ci/vuln-baseline.txt rather than written
      # here. Those three RUSTSEC ids are already accepted there, each with a
      # reason, and a second copy of the list in this file would be a second
      # thing to forget: dropping an entry from the baseline has to make this
      # job go red, or the baseline stops being the record of what we accept.
      - name: cargo audit
        run: |
          set -euo pipefail
          args=()
          while read -r id; do
            [ -n "$id" ] || continue
            echo "ignoring $id (accepted in ci/vuln-baseline.txt)"
            args+=(--ignore "$id")
          done < <(grep -oE '^RUSTSEC-[0-9]{4}-[0-9]{4}' ci/vuln-baseline.txt || true)
          cargo audit --deny yanked "${args[@]}"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The gitleaks binary, not gitleaks-action: the action requires a paid
      # GITLEAKS_LICENSE on organization repos. The tarball is verified against
      # the release's published checksums before it is unpacked, so a swapped
      # asset fails the job instead of running as root via `sudo install`.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          asset="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"

          curl -sSfL "${base}/${asset}" -o /tmp/gitleaks.tar.gz
          curl -sSfL "${base}/gitleaks_${version}_checksums.txt" -o /tmp/checksums.txt

          expected="$(grep " ${asset}\$" /tmp/checksums.txt | awk '{print $1}')"
          if [ -z "$expected" ]; then
            echo "::error::no checksum entry for ${asset}" >&2
            exit 1
          fi
          echo "${expected}  /tmp/gitleaks.tar.gz" | sha256sum -c -

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # On a PR, scan only that PR's commits. Scanning full history would let a
      # pre-existing finding block every unrelated PR, which trains people to
      # ignore the check. Push and schedule scan the working tree.
      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            gitleaks detect --source . --log-opts="${BASE_SHA}..HEAD" --redact --no-banner
          else
            gitleaks detect --source . --no-git --redact --no-banner
          fi

  workflow-sast:
    name: Workflow SAST (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          cache-suffix: security-zizmor # distinct key, see the pip-audit job

      # Scoped to the fork-owned workflows. The inherited ones are all disabled
      # and none is SHA-pinned, so auditing them here would produce a permanent
      # wall of findings about files that cannot execute — noise that would bury
      # a real finding in the three files that can.
      # GH_TOKEN switches zizmor from offline to online mode. Without it the
      # ref-version-mismatch audit cannot resolve a pinned SHA back to its tag,
      # which is the audit that catches a pin whose version comment has drifted
      # away from the commit it names — the exact way a pin stops being readable.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uvx zizmor==1.28.0 --persona=auditor --min-severity=low \
            .github/workflows/fork-gate.yml \
            .github/workflows/fork-security.yml \
            .github/workflows/fork-drift.yml
